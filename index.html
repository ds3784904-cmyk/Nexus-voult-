
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberVault X</title>

<style>
:root{
  --bg:#020606;
  --panel:#07110f;
  --panel2:#0a1714;
  --green:#00ffae;
  --cyan:#00d9ff;
  --text:#eafff9;
  --muted:#72918a;
  --border:#123c34;
  --red:#ff5555;
  --yellow:#ffd166;
  --shadow:0 0 25px rgba(0,255,174,.12);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

button,input{
  font:inherit;
}

button{cursor:pointer}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(rgba(0,255,174,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,174,.025) 1px,transparent 1px);
  background-size:40px 40px;
  z-index:-2;
}

body:after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:linear-gradient(
    transparent 50%,
    rgba(0,255,174,.025) 51%,
    transparent 52%
  );
  background-size:100% 7px;
  z-index:-1;
}

/* ---------- COMMON ---------- */

.hidden{display:none!important}

.green{color:var(--green)}
.cyan{color:var(--cyan)}
.muted{color:var(--muted)}

.btn{
  border:1px solid var(--green);
  background:rgba(0,255,174,.08);
  color:var(--green);
  padding:12px 18px;
  border-radius:8px;
  font-weight:700;
  transition:.2s;
}

.btn:hover{
  background:var(--green);
  color:#00120c;
  box-shadow:0 0 25px rgba(0,255,174,.35);
  transform:translateY(-2px);
}

.btn.secondary{
  border-color:var(--cyan);
  color:var(--cyan);
  background:rgba(0,217,255,.07);
}

.card{
  background:linear-gradient(145deg,var(--panel),#050d0b);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
}

.tag{
  display:inline-block;
  padding:5px 9px;
  border:1px solid var(--border);
  border-radius:20px;
  color:var(--green);
  font-size:11px;
  letter-spacing:1px;
}

.progress{
  width:100%;
  height:8px;
  background:#10221e;
  border-radius:20px;
  overflow:hidden;
}

.progress span{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--green),var(--cyan));
  box-shadow:0 0 12px var(--green);
}

/* ---------- LANDING ---------- */

.page{
  min-height:100vh;
}

#landing{
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
  position:relative;
}

.hero{
  max-width:800px;
}

.logo{
  font-size:clamp(42px,9vw,100px);
  font-weight:900;
  letter-spacing:5px;
  color:var(--green);
  text-shadow:
    0 0 10px rgba(0,255,174,.7),
    0 0 35px rgba(0,255,174,.3);
  animation:pulse 2s infinite alternate;
}

.logo small{
  display:block;
  font-size:12px;
  letter-spacing:5px;
  color:var(--cyan);
  margin-top:10px;
}

.hero h2{
  margin:30px 0 12px;
  font-size:clamp(22px,5vw,38px);
}

.hero p{
  color:var(--muted);
  max-width:600px;
  margin:auto;
  line-height:1.7;
}

.status{
  margin:25px auto;
  display:inline-flex;
  align-items:center;
  gap:8px;
  border:1px solid var(--border);
  padding:8px 14px;
  border-radius:30px;
  color:var(--green);
  background:rgba(0,255,174,.04);
}

.dot{
  width:8px;
  height:8px;
  background:var(--green);
  border-radius:50%;
  box-shadow:0 0 12px var(--green);
}

.hero-btn{
  margin-top:30px;
  padding:16px 28px;
  font-size:16px;
}

/* ---------- LOGIN ---------- */

#login{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.login-box{
  width:min(430px,100%);
  padding:32px;
}

.login-title{
  text-align:center;
  margin-bottom:28px;
}

.login-title .mini-logo{
  color:var(--green);
  font-size:25px;
  font-weight:900;
  letter-spacing:3px;
}

.login-title h2{
  margin:12px 0 7px;
}

.login-title p{
  color:var(--muted);
  font-size:12px;
  letter-spacing:2px;
}

.field{
  margin-bottom:18px;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:7px;
  letter-spacing:1px;
}

.field input{
  width:100%;
  padding:13px;
  background:#030908;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:8px;
  outline:none;
}

.field input:focus{
  border-color:var(--green);
  box-shadow:0 0 12px rgba(0,255,174,.12);
}

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:55px;
}

.show-pass{
  position:absolute;
  right:8px;
  top:7px;
  border:0;
  background:transparent;
  color:var(--muted);
  padding:7px;
}

.login-box .btn{
  width:100%;
}

.login-error{
  color:var(--red);
  text-align:center;
  font-size:13px;
  margin:12px 0;
  min-height:18px;
}

.back{
  margin-top:18px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
  cursor:pointer;
}

/* ---------- APP ---------- */

#app{
  min-height:100vh;
  display:flex;
}

.sidebar{
  width:250px;
  background:#030908;
  border-right:1px solid var(--border);
  position:fixed;
  top:0;
  bottom:0;
  left:0;
  z-index:20;
  padding:22px 15px;
  transition:.3s;
}

.side-logo{
  color:var(--green);
  font-weight:900;
  letter-spacing:3px;
  padding:10px;
  font-size:20px;
}

.side-sub{
  color:var(--muted);
  font-size:9px;
  letter-spacing:2px;
  padding:0 10px 25px;
}

.nav-title{
  color:#42625b;
  font-size:10px;
  letter-spacing:2px;
  padding:10px;
}

.nav button{
  width:100%;
  text-align:left;
  padding:12px 13px;
  margin:3px 0;
  border:1px solid transparent;
  border-radius:8px;
  color:var(--muted);
  background:transparent;
}

.nav button:hover,
.nav button.active{
  color:var(--green);
  border-color:var(--border);
  background:rgba(0,255,174,.06);
}

.side-bottom{
  position:absolute;
  bottom:20px;
  left:15px;
  right:15px;
}

.secure{
  padding:12px;
  border:1px solid var(--border);
  border-radius:10px;
  font-size:11px;
  color:var(--green);
}

.main{
  margin-left:250px;
  width:calc(100% - 250px);
  min-height:100vh;
}

.topbar{
  height:70px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  background:rgba(2,6,6,.9);
  position:sticky;
  top:0;
  z-index:10;
}

.menu-btn{
  display:none;
  border:1px solid var(--border);
  background:transparent;
  color:var(--green);
  padding:8px;
  border-radius:7px;
}

.top-title{
  color:var(--muted);
  font-size:12px;
  letter-spacing:2px;
}

.profile-area{
  position:relative;
}

.profile-btn{
  display:flex;
  align-items:center;
  gap:10px;
  border:0;
  background:transparent;
  color:var(--text);
}

.avatar{
  width:38px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--green);
  border-radius:50%;
  color:var(--green);
  font-weight:900;
  background:#06120f;
}

.profile-menu{
  position:absolute;
  right:0;
  top:50px;
  width:200px;
  padding:10px;
  z-index:30;
}

.profile-menu button{
  width:100%;
  padding:10px;
  text-align:left;
  color:var(--muted);
  background:transparent;
  border:0;
  border-radius:7px;
}

.profile-menu button:hover{
  background:rgba(0,255,174,.06);
  color:var(--green);
}

.content{
  padding:25px;
  max-width:1500px;
  margin:auto;
}

.view{
  display:none;
}

.view.active{
  display:block;
  animation:fade .25s ease;
}

.view-header{
  margin-bottom:25px;
}

.view-header h1{
  font-size:28px;
  margin-bottom:7px;
}

.view-header p{
  color:var(--muted);
}

/* ---------- DASHBOARD ---------- */

.welcome{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center;
  margin-bottom:25px;
}

.welcome h1{
  font-size:30px;
}

.welcome p{
  color:var(--muted);
  margin-top:6px;
}

.level-box{
  min-width:230px;
  padding:16px;
}

.level-top{
  display:flex;
  justify-content:space-between;
  margin-bottom:9px;
  font-size:12px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.stat{
  padding:20px;
}

.stat .label{
  color:var(--muted);
  font-size:11px;
  letter-spacing:1px;
}

.stat .number{
  font-size:30px;
  font-weight:900;
  color:var(--green);
  margin:9px 0;
}

.dashboard-grid{
  display:grid;
  grid-template-columns:1.5fr 1fr;
  gap:18px;
  margin-top:18px;
}

.card-pad{
  padding:20px;
}

.card-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.card-title h3{
  font-size:16px;
}

.mission-main{
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.mission-main h2{
  font-size:22px;
  margin-bottom:8px;
}

.mission-main p{
  color:var(--muted);
  line-height:1.6;
}

.mission-progress{
  margin-top:20px;
}

.activity{
  display:flex;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid rgba(18,60,52,.5);
  font-size:13px;
}

.activity:last-child{border-bottom:0}

.activity-icon{
  color:var(--green);
}

/* ---------- MISSIONS ---------- */

.mission-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.mission-card{
  padding:20px;
}

.mission-card.locked{
  opacity:.55;
}

.mission-card h2{
  margin:12px 0 8px;
}

.mission-card p{
  color:var(--muted);
  line-height:1.6;
  font-size:14px;
}

.mission-meta{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:15px 0;
}

/* ---------- LAB ---------- */

.lab-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.lab-card{
  padding:25px;
}

.lab-icon{
  font-size:30px;
  margin-bottom:12px;
}

.lab-card h2{
  margin-bottom:8px;
}

.lab-card p{
  color:var(--muted);
  line-height:1.6;
  margin-bottom:18px;
}

/* ---------- INVESTIGATION ---------- */

.case{
  padding:25px;
}

.case-header{
  display:flex;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px;
}

.case-code{
  color:var(--cyan);
  font-size:12px;
  letter-spacing:2px;
}

.clue{
  background:#020706;
  border:1px dashed var(--green);
  padding:25px;
  border-radius:10px;
  font-family:monospace;
  font-size:25px;
  text-align:center;
  color:var(--green);
  margin:20px 0;
}

.answer-row{
  display:flex;
  gap:10px;
}

.answer-row input{
  flex:1;
  background:#020706;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:8px;
  padding:13px;
}

.case-result{
  margin-top:15px;
  min-height:22px;
}

/* ---------- ACHIEVEMENTS ---------- */

.achievement-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.badge{
  padding:20px;
  text-align:center;
}

.badge-icon{
  font-size:35px;
  margin-bottom:12px;
}

.badge h3{
  margin-bottom:7px;
}

.badge p{
  color:var(--muted);
  font-size:12px;
}

.badge.locked{
  opacity:.4;
}

/* ---------- TERMINAL ---------- */

.terminal{
  background:#010504;
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}

.term-head{
  padding:12px 15px;
  border-bottom:1px solid var(--border);
  color:var(--green);
  font-size:12px;
}

.term-output{
  min-height:400px;
  padding:18px;
  font-family:monospace;
  line-height:1.7;
  white-space:pre-wrap;
  color:#bfffe9;
  overflow:auto;
}

.term-input{
  display:flex;
  border-top:1px solid var(--border);
}

.term-input span{
  padding:14px;
  color:var(--green);
  font-family:monospace;
}

.term-input input{
  flex:1;
  background:transparent;
  color:var(--text);
  border:0;
  outline:0;
  font-family:monospace;
}

/* ---------- PROFILE ---------- */

.profile-card{
  max-width:700px;
  padding:28px;
}

.big-profile{
  display:flex;
  align-items:center;
  gap:18px;
  margin-bottom:25px;
}

.big-avatar{
  width:75px;
  height:75px;
  border:2px solid var(--green);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--green);
  font-size:28px;
  font-weight:900;
  box-shadow:0 0 25px rgba(0,255,174,.15);
}

.profile-details{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.detail{
  padding:13px;
  background:#040b09;
  border:1px solid var(--border);
  border-radius:8px;
}

.detail small{
  display:block;
  color:var(--muted);
  margin-bottom:5px;
}

/* ---------- SETTINGS ---------- */

.setting{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 0;
  border-bottom:1px solid var(--border);
}

.switch{
  width:45px;
  height:24px;
  background:#13231f;
  border-radius:20px;
  position:relative;
  cursor:pointer;
}

.switch:after{
  content:"";
  position:absolute;
  width:18px;
  height:18px;
  top:3px;
  left:4px;
  border-radius:50%;
  background:var(--muted);
  transition:.2s;
}

.switch.on{
  background:rgba(0,255,174,.2);
}
